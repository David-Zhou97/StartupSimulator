<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创业模拟器</title>
<style>
/* ============================================================
   样式
   ============================================================ */
:root {
  --bg: #0d0d1a;
  --bg-dark: #08080f;
  --bg-card: #16162c;
  --bg-card-hover: #222248;
  --border: #3a3a6a;
  --ink: #e8e8d8;
  --text: #e8e8d8;
  --text-dim: #8c8caa;
  --accent: #4dd8ff;
  --green: #58e858;
  --red: #ff5252;
  --gold: #ffd23e;
  --cash: #ffd23e;
  --team: #4dd8ff;
  --network: #c980ff;
  --health: #ff6b9d;
  --shadow: #000;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", monospace;
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}
/* CRT 扫描线 */
body::after {
  content: "";
  position: fixed; inset: 0; z-index: 99;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
}
#app { max-width: 720px; margin: 0 auto; padding: 16px; }

/* ---------- HUD ---------- */
#hud {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 3px solid var(--border);
  padding: 10px 4px 12px;
  margin-bottom: 18px;
}
#hud-time {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
}
#hud-time .time-label { font-size: 1rem; font-weight: 700; color: var(--accent); text-shadow: 2px 2px 0 var(--shadow); }
#hud-time .time-label::before { content: "▶ "; }
#hud-time .progress-label { font-size: 0.78rem; color: var(--text-dim); }
#stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.stat { position: relative; }
.stat-head { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 2px; }
.stat-name { color: var(--text-dim); }
.stat-value { font-variant-numeric: tabular-nums; font-weight: 700; }
.stat-bar { position: relative; height: 12px; background: var(--bg-dark); border: 2px solid var(--border); }
.stat-fill { height: 100%; transition: width 0.4s steps(8); }
.stat-bar::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 8px, var(--bg) 8px 10px);
}
.stat[data-attr="cash"]    .stat-fill { background: var(--cash); }
.stat[data-attr="team"]    .stat-fill { background: var(--team); }
.stat[data-attr="network"] .stat-fill { background: var(--network); }
.stat[data-attr="health"]  .stat-fill { background: var(--health); }
.stat.warning .stat-bar { animation: blinkRed 0.8s steps(2) infinite; }
.stat.warning .stat-value { color: var(--red); }
@keyframes blinkRed {
  0%, 100% { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
  50% { border-color: var(--border); box-shadow: none; }
}
.float-fx {
  position: absolute; right: 0; top: -4px;
  font-size: 0.85rem; font-weight: 700;
  animation: floatUp 1.6s steps(10) forwards;
  pointer-events: none; white-space: nowrap;
  text-shadow: 1px 1px 0 var(--shadow);
}
.float-fx.pos { color: var(--green); }
.float-fx.neg { color: var(--red); }
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(4px); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-22px); }
}

/* ---------- 主区域 ---------- */
.card {
  background: var(--bg-card);
  border: 3px solid var(--border);
  box-shadow: 4px 4px 0 var(--shadow);
  padding: 18px;
  margin-bottom: 18px;
  animation: fadeIn 0.25s steps(4);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card h2 { font-size: 1.1rem; margin-bottom: 10px; }
.card h2::before { content: "■ "; color: var(--accent); }
.card .scene { color: var(--text); white-space: pre-wrap; }
.card .dim { color: var(--text-dim); font-size: 0.88rem; }
.result-card.crit-success {
  border-color: var(--gold);
  box-shadow: 4px 4px 0 var(--shadow), 0 0 14px rgba(255,210,62,0.5);
}
.result-card.crit-success h2::before { color: var(--gold); }
.result-card.crit-fail {
  border-color: var(--red);
  box-shadow: 4px 4px 0 var(--shadow), 0 0 14px rgba(255,82,82,0.5);
  animation: shatter 0.5s steps(6);
}
.result-card.crit-fail h2::before { color: var(--red); }
@keyframes shatter {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
.crit-prefix { font-weight: 700; display: block; margin-bottom: 6px; }
.crit-success .crit-prefix { color: var(--gold); }
.crit-fail .crit-prefix { color: var(--red); }
.fx-list { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.fx-tag {
  font-size: 0.85rem; font-weight: 700;
  padding: 1px 8px;
  background: var(--bg-dark);
  border: 2px solid var(--border);
}
.fx-tag.pos { color: var(--green); }
.fx-tag.neg { color: var(--red); }

/* ---------- 按钮 ---------- */
.btn {
  display: block; width: 100%;
  background: var(--bg-card);
  border: 3px solid var(--ink);
  box-shadow: 4px 4px 0 var(--shadow);
  color: var(--text);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 0.92rem;
  font-family: inherit;
  line-height: 1.7;
  text-align: left;
  cursor: pointer;
}
.btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
.btn:active { transform: translate(4px, 4px); box-shadow: none; }
.btn .btn-title { font-weight: 700; }
.btn .btn-title::before { content: "▷ "; color: var(--text-dim); }
.btn:hover .btn-title::before { content: "▶ "; color: var(--accent); }
.btn .btn-sub { color: var(--text-dim); font-size: 0.84rem; margin-top: 3px; }
.btn-primary {
  background: var(--gold); color: #1a1400; text-align: center; font-weight: 700;
  border-color: var(--ink);
  letter-spacing: 4px;
}
.btn-primary:hover { background: var(--accent); border-color: var(--ink); color: #001a22; }

/* ---------- 百搭卡弹层 ---------- */
#overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.wildcard {
  background: var(--bg-card);
  border: 4px solid var(--gold);
  max-width: 560px; width: 100%;
  max-height: 88vh; overflow-y: auto;
  padding: 20px;
  box-shadow: 6px 6px 0 var(--shadow), 0 0 24px rgba(255,210,62,0.35);
  animation: fadeIn 0.25s steps(4);
}
.wildcard h2::before { content: "■ "; color: var(--gold); }
.wildcard-tag {
  display: inline-block;
  background: var(--gold); color: #1a1400;
  font-size: 0.75rem; font-weight: 700;
  padding: 2px 10px;
  margin-bottom: 10px;
}

/* ---------- 结局页 ---------- */
.ending-title {
  font-size: 1.6rem; font-weight: 800; text-align: center; margin: 20px 0 6px;
  letter-spacing: 2px; text-shadow: 3px 3px 0 var(--shadow);
}
.ending-sub { text-align: center; color: var(--text-dim); margin-bottom: 18px; }
.ending-text { white-space: pre-wrap; }
.ending-lesson {
  margin-top: 14px; padding: 12px 14px;
  border: 2px solid var(--gold);
  background: rgba(255,210,62,0.07);
  font-weight: 700;
}
.report-stat { margin-bottom: 10px; }
.report-stat .stat-head { font-size: 0.9rem; }
.log-item { padding: 8px 0; border-bottom: 2px dashed var(--border); font-size: 0.88rem; }
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--text-dim); margin-right: 8px; }
.log-item.crit_success .log-tier { color: var(--gold); font-weight: 700; }
.log-item.crit_fail .log-tier { color: var(--red); font-weight: 700; }
.footnote { text-align: center; color: var(--text-dim); font-size: 0.78rem; margin: 24px 0 10px; }

/* ---------- 开局 ---------- */
.title-hero {
  text-align: center; margin: 36px 0 8px; font-size: 1.9rem; font-weight: 800;
  letter-spacing: 6px;
  color: var(--gold);
  text-shadow: 3px 3px 0 var(--shadow), 5px 5px 0 var(--border);
}
.title-hero-sub { text-align: center; color: var(--text-dim); margin-bottom: 28px; }
.title-hero-sub::after { content: "▮"; margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.idea-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.idea-stat {
  font-size: 0.8rem; color: var(--text-dim);
  background: var(--bg-dark); border: 2px solid var(--border);
  padding: 1px 8px;
}

/* ---------- debug ---------- */
#debug-panel {
  border: 2px dashed var(--red);
  padding: 8px 12px; margin-bottom: 12px;
  font-size: 0.8rem; color: var(--red);
  font-family: ui-monospace, monospace;
}

@media (max-width: 480px) {
  #stats { grid-template-columns: 1fr; gap: 6px; }
  #app { padding: 10px; }
  .card { padding: 14px; }
  .title-hero { letter-spacing: 3px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="hud" style="display:none">
    <div id="hud-time">
      <span class="time-label" id="time-label"></span>
      <span class="progress-label" id="progress-label"></span>
    </div>
    <div id="stats"></div>
  </div>
  <div id="main"></div>
</div>

const ATTRS = ["cash", "team", "network", "health"];
const ATTR_META = {
  cash:    { icon: "💰", name: "现金" },
  team:    { icon: "👥", name: "团队" },
  network: { icon: "🤝", name: "人脉" },
  health:  { icon: "❤️", name: "健康" },
};
const TOTAL_NODES = 27;
const WILDCARD_CHANCE = { 1: 0.30, 2: 0.40, 3: 0.50 };
const CRIT_SUCCESS_PREFIX = "🎉 时来运转！";
const CRIT_FAIL_PREFIX = "💀 祸不单行！";
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

/* ============================================================
   state —— 游戏状态（全部内存，不使用任何存储）
   ============================================================ */
let state = null;

function newState(idea) {
  return {
    idea,
    stats: { ...idea.stats },
    node: 0,                 // 当前节点（1–27）
    lastChoiceIds: [],       // 上一节点展示过的 3 个选项 id
    usedWildcards: new Set(),
    log: [],                 // { node, time, actionId, tier }
    critSuccessCount: 0,
    over: false,
  };
}

/* ============================================================
   engine —— 节点推进 / 掷骰 / 结算
   ============================================================ */
function phaseOfNode(node) {
  if (node <= 12) return 1;
  if (node <= 20) return 2;
  return 3;
}

function timeLabel(node) {
  if (node <= 12) return `第 1 年 · ${node} 月`;
  if (node <= 20) {
    const idx = node - 13;
    return `第 ${2 + Math.floor(idx / 4)} 年 · Q${(idx % 4) + 1}`;
  }
  return `第 ${node - 17} 年`;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// 属性修正：clamp(floor((关联属性-50)/15), -3, +3)；checkAttr 为 null 无修正
function attrMod(checkAttr) {
  if (!checkAttr) return 0;
  return clamp(Math.floor((state.stats[checkAttr] - 50) / 15), -3, 3);
}

// 应用 fx（可选倍率），返回实际生效的变化量
function applyFx(fx, mult) {
  mult = mult || 1;
  const applied = {};
  for (const attr of ATTRS) {
    let delta = fx[attr] || 0;
    if (delta !== 0 && mult !== 1) {
      delta = Math.sign(delta) * Math.ceil(Math.abs(delta) * mult);
    }
    if (delta !== 0) {
      const before = state.stats[attr];
      state.stats[attr] = clamp(before + delta, 0, 100);
      applied[attr] = state.stats[attr] - before;
    }
  }
  return applied;
}

// 归零检查，多属性同时归零按 健康>现金>团队>人脉 优先
function checkZero() {
  for (const attr of ["health", "cash", "team", "network"]) {
    if (state.stats[attr] <= 0) return attr;
  }
  return null;
}

// 从当前阶段选项池抽 3 个，排除上一节点展示过的（池子不足则放开）
function drawChoices() {
  const phase = phaseOfNode(state.node);
  const pool = ACTIONS.filter(a =>
    a.phase === phase && (!a.ideaOnly || a.ideaOnly === state.idea.id)
  );
  let candidates = pool.filter(a => !state.lastChoiceIds.includes(a.id));
  if (candidates.length < 3) candidates = pool.slice();
  const picked = [];
  const bag = candidates.slice();
  while (picked.length < 3 && bag.length > 0) {
    const i = Math.floor(Math.random() * bag.length);
    picked.push(bag.splice(i, 1)[0]);
  }
  state.lastChoiceIds = picked.map(a => a.id);
  return picked;
}

// d20 判定（天然骰优先）
function resolveAction(action) {
  const roll = Math.floor(Math.random() * 20) + 1;
  const mod = attrMod(action.checkAttr);
  const total = roll + mod;
  let tier, outcome, mult = 1, prefix = "";
  if (roll === 20) {
    tier = "crit_success"; outcome = action.success; mult = 1.5; prefix = CRIT_SUCCESS_PREFIX;
    state.critSuccessCount++;
  } else if (roll === 1) {
    tier = "crit_fail"; outcome = action.fail; mult = 1.5; prefix = CRIT_FAIL_PREFIX;
  } else if (total >= action.S) {
    tier = "success"; outcome = action.success;
  } else if (total >= action.F) {
    tier = "mid"; outcome = action.mid;
  } else {
    tier = "fail"; outcome = action.fail;
  }
  const applied = applyFx(outcome.fx, mult);
  state.log.push({ node: state.node, time: timeLabel(state.node), actionId: action.id, tier });
  return { roll, mod, total, tier, prefix, text: outcome.text, applied };
}

// 抽百搭卡（可能返回 null）
function maybeDrawWildcard() {
  const phase = phaseOfNode(state.node);
  if (Math.random() >= WILDCARD_CHANCE[phase]) return null;
  const available = WILDCARDS.filter(w =>
    !state.usedWildcards.has(w.id) && (!w.phase || w.phase.includes(phase))
  );
  if (available.length === 0) return null;
  const card = available[Math.floor(Math.random() * available.length)];
  state.usedWildcards.add(card.id);
  return card;
}

// 十年结局判定（严格从上到下，命中即停）
function judgeFinalEnding() {
  const s = state.stats;
  const total = s.cash + s.team + s.network + s.health;
  for (const e of ENDINGS.final) {
    if (e.cond(s, total, state.critSuccessCount)) return e;
  }
  return ENDINGS.final[ENDINGS.final.length - 1];
}

/* ============================================================
   ui —— 渲染
   ============================================================ */
const $hud = document.getElementById("hud");
const $main = document.getElementById("main");
const $stats = document.getElementById("stats");
const $timeLabel = document.getElementById("time-label");
const $progressLabel = document.getElementById("progress-label");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function fxTags(applied) {
  const tags = [];
  for (const attr of ATTRS) {
    const d = applied[attr];
    if (!d) continue;
    const m = ATTR_META[attr];
    tags.push(`<span class="fx-tag ${d > 0 ? "pos" : "neg"}">${m.icon} ${m.name} ${d > 0 ? "+" : ""}${d}</span>`);
  }
  return tags.length ? `<div class="fx-list">${tags.join("")}</div>` : "";
}

function renderHUD(applied) {
  $hud.style.display = "block";
  $timeLabel.textContent = timeLabel(state.node);
  $progressLabel.textContent = `第 ${state.node}/${TOTAL_NODES} 个节点`;
  $stats.innerHTML = ATTRS.map(attr => {
    const v = state.stats[attr];
    const m = ATTR_META[attr];
    return `<div class="stat ${v <= 20 ? "warning" : ""}" data-attr="${attr}">
      <div class="stat-head">
        <span class="stat-name">${m.icon} ${m.name}</span>
        <span class="stat-value">${v}</span>
      </div>
      <div class="stat-bar"><div class="stat-fill" style="width:${v}%"></div></div>
    </div>`;
  }).join("");
  if (applied) {
    for (const attr of ATTRS) {
      const d = applied[attr];
      if (!d) continue;
      const el = $stats.querySelector(`.stat[data-attr="${attr}"]`);
      const f = document.createElement("span");
      f.className = "float-fx " + (d > 0 ? "pos" : "neg");
      f.textContent = (d > 0 ? "+" : "") + d;
      el.appendChild(f);
      setTimeout(() => f.remove(), 1600);
    }
  }
}

function debugPanel(info) {
  if (!DEBUG || !info) return "";
  return `<div id="debug-panel">[debug] roll=${info.roll} mod=${info.mod >= 0 ? "+" : ""}${info.mod} total=${info.total} ｜ S=${info.S} F=${info.F} ｜ tier=${info.tier}</div>`;
}

function showStart() {
  state = null;
  $hud.style.display = "none";
  $main.innerHTML = `
    <div class="title-hero">创业模拟器</div>
    <div class="title-hero-sub">十年一觉创业梦 —— 选一个点子，开始你的十年。</div>
    ${IDEAS.map(idea => `
      <button class="btn" data-idea="${idea.id}">
        <div class="btn-title">${esc(idea.name)}</div>
        <div class="btn-sub">${esc(idea.desc)}</div>
        <div class="idea-stats">${ATTRS.map(a =>
          `<span class="idea-stat">${ATTR_META[a].icon} ${ATTR_META[a].name} ${idea.stats[a]}</span>`).join("")}
        </div>
      </button>`).join("")}
  `;
  $main.querySelectorAll("[data-idea]").forEach(btn => {
    btn.addEventListener("click", () => {
      const idea = IDEAS.find(i => i.id === btn.dataset.idea);
      state = newState(idea);
      showFlavor(idea);
    });
  });
}

function showFlavor(idea) {
  $main.innerHTML = `
    <div class="card">
      <h2>${esc(idea.name)}</h2>
      <p class="scene">${esc(idea.flavor)}</p>
    </div>
    <button class="btn btn-primary" id="go">开始创业</button>
  `;
  document.getElementById("go").addEventListener("click", nextNode);
}

/* ---------- 节点 ---------- */
function nextNode() {
  state.node++;
  if (state.node > TOTAL_NODES) { showFinalEnding(); return; }
  renderHUD();
  const choices = drawChoices();
  $main.innerHTML = `
    <div class="card">
      <h2>${esc(timeLabel(state.node))}</h2>
      <p class="dim">这个节点，你决定——</p>
    </div>
    ${choices.map((a, i) => `
      <button class="btn" data-i="${i}">
        <div class="btn-title">${esc(a.title)}</div>
        <div class="btn-sub">${esc(a.scene)}</div>
      </button>`).join("")}
  `;
  $main.querySelectorAll("[data-i]").forEach(btn => {
    btn.addEventListener("click", () => onAction(choices[+btn.dataset.i]));
  });
}

function onAction(action) {
  const r = resolveAction(action);
  renderHUD(r.applied);
  const critClass = r.tier === "crit_success" ? "crit-success" : r.tier === "crit_fail" ? "crit-fail" : "";
  $main.innerHTML = `
    ${debugPanel({ ...r, S: action.S, F: action.F })}
    <div class="card result-card ${critClass}">
      <h2>${esc(action.title)}</h2>
      ${r.prefix ? `<span class="crit-prefix">${esc(r.prefix)}</span>` : ""}
      <p class="scene">${esc(r.text)}</p>
      ${fxTags(r.applied)}
    </div>
    <button class="btn btn-primary" id="next">继续</button>
  `;
  document.getElementById("next").addEventListener("click", afterAction);
}

function afterAction() {
  const zero = checkZero();
  if (zero) { showZeroEnding(zero); return; }
  const card = maybeDrawWildcard();
  if (card) { showWildcard(card); return; }
  nextNode();
}

/* ---------- 百搭卡 ---------- */
function showWildcard(card) {
  const overlay = document.createElement("div");
  overlay.id = "overlay";
  overlay.innerHTML = `
    <div class="wildcard">
      <span class="wildcard-tag">⚡ 突发事件</span>
      <h2>${esc(card.title)}</h2>
      <p class="scene">${esc(card.scene)}</p>
      <div style="margin-top:14px">
        ${card.options.map((o, i) => `
          <button class="btn" data-i="${i}"><div class="btn-title">${esc(o.label)}</div></button>`).join("")}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll("[data-i]").forEach(btn => {
    btn.addEventListener("click", () => {
      const opt = card.options[+btn.dataset.i];
      const applied = applyFx(opt.fx);
      renderHUD(applied);
      overlay.querySelector(".wildcard").innerHTML = `
        <span class="wildcard-tag">⚡ 突发事件</span>
        <h2>${esc(card.title)}</h2>
        <p class="dim" style="margin-bottom:8px">你选择了：${esc(opt.label)}</p>
        <p class="scene">${esc(opt.text)}</p>
        ${fxTags(applied)}
        <div style="margin-top:14px"><button class="btn btn-primary" id="wc-next">继续</button></div>
      `;
      overlay.querySelector("#wc-next").addEventListener("click", () => {
        overlay.remove();
        const zero = checkZero();
        if (zero) { showZeroEnding(zero); return; }
        nextNode();
      });
    });
  });
}

/* ---------- 结局 ---------- */
function endingReport() {
  const critSuccess = state.log.filter(l => l.tier === "crit_success").slice(0, 5);
  const critFail = state.log.filter(l => l.tier === "crit_fail").slice(0, 5);
  const actionTitle = id => { const a = ACTIONS.find(x => x.id === id); return a ? a.title : id; };
  const logHtml = [...critSuccess, ...critFail]
    .sort((a, b) => a.node - b.node)
    .map(l => `<div class="log-item ${l.tier}">
      <span class="log-time">${esc(l.time)}</span>
      <span class="log-tier">${l.tier === "crit_success" ? "🎉 大成功" : "💀 大失败"}</span>
      · ${esc(actionTitle(l.actionId))}
    </div>`).join("");
  return `
    <div class="card">
      <h2>📋 十年创业报告</h2>
      ${ATTRS.map(attr => {
        const v = state.stats[attr]; const m = ATTR_META[attr];
        return `<div class="report-stat stat" data-attr="${attr}">
          <div class="stat-head"><span class="stat-name">${m.icon} ${m.name}</span><span class="stat-value">${v}</span></div>
          <div class="stat-bar"><div class="stat-fill" style="width:${v}%"></div></div>
        </div>`;
      }).join("")}
      ${logHtml ? `<h2 style="margin-top:16px">🔑 关键选择回顾</h2>${logHtml}` : `<p class="dim" style="margin-top:12px">这十年没有惊天动地的大成功或大失败——平凡，也是一种叙事。</p>`}
    </div>
    <button class="btn btn-primary" id="restart">再来一局</button>
    <div class="footnote">本游戏纯属虚构，如有雷同——那你可能真的创过业。</div>
  `;
}

function showEndingPage(title, badge, text, lesson) {
  state.over = true;
  $main.innerHTML = `
    ${badge ? `<div class="ending-sub" style="margin-top:20px">${esc(badge)}</div>` : ""}
    <div class="ending-title">${esc(title)}</div>
    <div class="ending-sub">${esc(timeLabel(Math.min(state.node, TOTAL_NODES)))} · ${esc(state.idea.name)}</div>
    <div class="card">
      <p class="ending-text scene">${esc(text)}</p>
      <div class="ending-lesson">${esc(lesson)}</div>
    </div>
    ${endingReport()}
  `;
  document.getElementById("restart").addEventListener("click", showStart);
  window.scrollTo(0, 0);
}

function showZeroEnding(attr) {
  const e = ENDINGS.zero[attr];
  showEndingPage(`${ATTR_META[attr].icon} ${e.title}`, "归零结局", e.text, e.lesson);
}

function showFinalEnding() {
  const e = judgeFinalEnding();
  showEndingPage(e.title, e.badge || "十年结局", e.text, e.lesson);
}

/* ---------- 启动 ---------- */
showStart();
</script>
</body>
</html>
