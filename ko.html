<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스타트업 시뮬레이터</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
/* ============================================================
   样式（像素/复古风）
   ============================================================ */
:root {
  --bg: #0c0c14;
  --bg-dark: #07070d;
  --bg-card: #14141f;
  --bg-card-hover: #1b1b2a;
  --border: #2c2c40;
  --border-strong: #40405c;
  --ink: #e6e0cd;
  --text: #e6e0cd;
  --text-dim: #8d8a99;
  --accent: #f2c14e;
  --green: #7bd88a;
  --red: #e85d5d;
  --gold: #f2c14e;
  --cash: #d9a02c;
  --traction: #5b96db;
  --team: #5b96db;
  --network: #5b96db;
  --health: #5b96db;
  --shadow: #000;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", monospace;
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}
/* CRT 扫描线 */
body::after {
  content: "";
  position: fixed; inset: 0; z-index: 99;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
}
#app { max-width: 720px; margin: 0 auto; padding: 16px; }

/* ---------- HUD ---------- */
#hud {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 3px solid var(--border);
  padding: 10px 4px 10px;
  margin-bottom: 18px;
}
#hud-time {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px; flex-wrap: wrap; gap: 4px;
}
#hud-time .time-label { font-size: 1rem; font-weight: 700; color: var(--accent); text-shadow: 2px 2px 0 var(--shadow); }
#hud-time .time-label::before { content: "▶ "; }
#hud-time .progress-label { font-size: 0.78rem; color: var(--text-dim); }
.stage-badge {
  display: inline-block;
  font-size: 0.72rem; font-weight: 700;
  color: var(--gold);
  border: 2px solid var(--border-strong);
  padding: 0 8px; margin-left: 8px;
  vertical-align: 2px;
}
#stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.stat { position: relative; }
.stat[data-attr="cash"] { grid-column: 1 / -1; }
.stat-head { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 2px; }
.stat-name { color: var(--text-dim); }
.stat-value { font-variant-numeric: tabular-nums; font-weight: 700; }
.stat-bar { position: relative; height: 12px; background: var(--bg-dark); border: 2px solid var(--border); }
.stat-fill { height: 100%; transition: width 0.4s steps(8); }
.stat-bar::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 8px, var(--bg) 8px 10px);
}
.stat[data-attr="cash"]     .stat-fill { background: var(--cash); }
.stat[data-attr="traction"] .stat-fill { background: var(--traction); }
.stat[data-attr="team"]     .stat-fill { background: var(--team); }
.stat[data-attr="network"]  .stat-fill { background: var(--network); }
.stat[data-attr="health"]   .stat-fill { background: var(--health); }
.stat.overflow .stat-bar { border-color: var(--gold); box-shadow: 0 0 8px rgba(242,193,78,0.45); }
.stat.warning .stat-bar { animation: blinkRed 0.8s steps(2) infinite; }
.stat.warning .stat-fill { background: var(--red); }
.stat.warning .stat-value { color: var(--red); }
@keyframes blinkRed {
  0%, 100% { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
  50% { border-color: var(--border); box-shadow: none; }
}
#hud-info {
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px;
  font-size: 0.74rem; color: var(--text-dim); margin-top: 8px;
}
#hud-info .pos { color: var(--green); }
#hud-info .neg { color: var(--red); }
#hud-info .fund-progress { color: var(--gold); }
.float-fx {
  position: absolute; right: 2px; bottom: -2px;
  font-size: 0.85rem; font-weight: 700;
  animation: floatUp 1.6s steps(10) forwards;
  pointer-events: none; white-space: nowrap;
  text-shadow: 1px 1px 0 var(--shadow);
}
.float-fx.pos { color: var(--green); }
.float-fx.neg { color: var(--red); }
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(4px); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-22px); }
}

/* ---------- 主区域 ---------- */
.card {
  background: var(--bg-card);
  border: 3px solid var(--border);
  box-shadow: 4px 4px 0 var(--shadow);
  padding: 18px;
  margin-bottom: 18px;
  animation: fadeIn 0.25s steps(4);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card h2 { font-size: 1.1rem; margin-bottom: 10px; }
.card h2::before { content: "■ "; color: var(--accent); }
.card .scene { color: var(--text); white-space: pre-wrap; }
.card .dim { color: var(--text-dim); font-size: 0.88rem; }
.result-card.crit-success {
  border-color: var(--gold);
  box-shadow: 4px 4px 0 var(--shadow), 0 0 14px rgba(242,193,78,0.45);
}
.result-card.crit-success h2::before { color: var(--gold); }
.result-card.crit-fail {
  border-color: var(--red);
  box-shadow: 4px 4px 0 var(--shadow), 0 0 14px rgba(232,93,93,0.45);
  animation: shatter 0.5s steps(6);
}
.result-card.crit-fail h2::before { color: var(--red); }
@keyframes shatter {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
.crit-prefix { font-weight: 700; display: block; margin-bottom: 6px; }
.crit-success .crit-prefix { color: var(--gold); }
.crit-fail .crit-prefix { color: var(--red); }
.fx-list { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.fx-tag {
  font-size: 0.85rem; font-weight: 700;
  padding: 1px 8px;
  background: var(--bg-dark);
  border: 2px solid var(--border);
}
.fx-tag.pos { color: var(--green); }
.fx-tag.neg { color: var(--red); }

/* ---------- 按钮 ---------- */
.btn {
  display: block; width: 100%;
  touch-action: manipulation;
  background: var(--bg-card);
  border: 3px solid var(--border-strong);
  box-shadow: 4px 4px 0 var(--shadow);
  color: var(--text);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 0.92rem;
  font-family: inherit;
  line-height: 1.7;
  text-align: left;
  cursor: pointer;
}
.btn:active { transform: translate(4px, 4px); box-shadow: none; }
.btn .btn-title { font-weight: 700; }
.btn .btn-title::before { content: "▷ "; color: var(--text-dim); }
.btn .btn-sub { color: var(--text-dim); font-size: 0.84rem; margin-top: 3px; }
.tag-chip {
  display: inline-block;
  font-size: 0.7rem; font-weight: 700;
  color: var(--text-dim);
  border: 2px solid var(--border);
  padding: 0 6px; margin-right: 6px;
  vertical-align: 2px;
}
.btn-ipo { border-color: var(--gold); }
.btn-ipo .btn-title::before { content: "◆ "; color: var(--gold); }
.btn-primary {
  background: var(--gold); color: #1a1400; text-align: center; font-weight: 700;
  border-color: var(--gold);
  letter-spacing: 4px;
}

/* ---------- 弹层（百搭卡 / 融资） ---------- */
#overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.wildcard {
  background: var(--bg-card);
  border: 4px solid var(--gold);
  max-width: 560px; width: 100%;
  max-height: 88vh; overflow-y: auto;
  padding: 20px;
  box-shadow: 6px 6px 0 var(--shadow), 0 0 24px rgba(242,193,78,0.3);
  animation: fadeIn 0.25s steps(4);
}
.wildcard h2::before { content: "■ "; color: var(--gold); }
.wildcard-tag {
  display: inline-block;
  background: var(--gold); color: #1a1400;
  font-size: 0.75rem; font-weight: 700;
  padding: 2px 10px;
  margin-bottom: 10px;
}
.funding-card { border-color: var(--gold); }
.funding-card h2::before { color: var(--gold); }
.funding-amount {
  font-size: 1.5rem; font-weight: 800; color: var(--green);
  text-shadow: 2px 2px 0 var(--shadow);
  margin: 8px 0;
}

/* ---------- 结局页 ---------- */
.ending-title {
  font-size: 1.6rem; font-weight: 800; text-align: center; margin: 20px 0 6px;
  letter-spacing: 2px; text-shadow: 3px 3px 0 var(--shadow);
}
.ending-sub { text-align: center; color: var(--text-dim); margin-bottom: 18px; }
.ending-text { white-space: pre-wrap; }
.ending-lesson {
  margin-top: 14px; padding: 12px 14px;
  border: 2px solid var(--gold);
  background: rgba(242,193,78,0.07);
  font-weight: 700;
}
.report-stat { margin-bottom: 10px; }
.report-stat .stat-head { font-size: 0.9rem; }
.log-item { padding: 8px 0; border-bottom: 2px dashed var(--border); font-size: 0.88rem; }
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--text-dim); margin-right: 8px; }
.log-item.crit_success .log-tier { color: var(--gold); font-weight: 700; }
.log-item.crit_fail .log-tier { color: var(--red); font-weight: 700; }
.log-item.fund .log-tier { color: var(--green); font-weight: 700; }
.footnote { text-align: center; color: var(--text-dim); font-size: 0.78rem; margin: 24px 0 10px; }

/* ---------- 入场演出 ---------- */
@keyframes riseIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
.rise-in { animation: riseIn 0.45s steps(6) both; }
.intro-line { animation: riseIn 0.55s steps(6) both; margin-bottom: 0.4em; }
.idea-list .btn, .choice-list .btn, .char-list .btn { animation: riseIn 0.4s steps(5) both; }
.idea-list .btn:nth-child(2), .choice-list .btn:nth-child(2), .char-list .btn:nth-child(2) { animation-delay: 0.08s; }
.idea-list .btn:nth-child(3), .choice-list .btn:nth-child(3), .char-list .btn:nth-child(3) { animation-delay: 0.16s; }
.choice-list .btn:nth-child(4), .char-list .btn:nth-child(4) { animation-delay: 0.24s; }
.char-list .btn:nth-child(5) { animation-delay: 0.32s; }
.char-list .btn:nth-child(6) { animation-delay: 0.40s; }
@keyframes stageIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
.char-stage { animation: stageIn 0.55s steps(7) both; }
@keyframes artSlideIn {
  from { opacity: 0; transform: translateX(-18px); }
  to { opacity: 1; transform: none; }
}
.char-flavor-art img { animation: artSlideIn 0.45s steps(6) both; }
.char-flavor-text { animation: riseIn 0.45s steps(6) both; animation-delay: 0.12s; }

/* ---------- 角色选择 ---------- */
.char-card { position: relative; overflow: hidden; z-index: 100; }
.char-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.char-card.tier-light::before { background: var(--green); }
.char-card.tier-bold::before { background: var(--red); }
.char-card.tier-growth::before { background: #c980ff; }
.char-card::after {
  content: ""; position: absolute; inset: 6px;
  border: 1px solid rgba(232, 224, 205, 0.08);
  pointer-events: none;
}
/* 移动端：顶部固定立绘舞台，文字卡横滑，人物原位替换（滑动进度驱动） */
.char-stage { position: relative; height: 44vh; min-height: 260px; margin-bottom: 4px; overflow: hidden; z-index: 100; }
.char-stage .stage-art {
  position: absolute; left: 50%; top: 0; height: 100%;
  transform: translateX(-50%);
  object-fit: contain;
  filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.45));
  will-change: transform, opacity;
  pointer-events: none;
  opacity: 0;
}
.char-stage .stage-art.emoji-layer {
  display: flex; align-items: center; justify-content: center;
  font-size: 110px; width: 100%;
}
/* 移动端：单页大卡左右滑（scroll-snap 轮播） */
.char-list {
  display: flex; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  gap: 14px; padding: 4px 9vw 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.char-list::-webkit-scrollbar { display: none; }
.char-list .btn { flex: 0 0 82vw; max-width: 340px; scroll-snap-align: center; }
.char-card .char-portrait { display: none; } /* 移动端立绘由舞台展示 */
.char-swipe-hint { text-align: center; color: var(--text-dim); font-size: 0.78rem; margin: 6px 0 2px; }
.char-dots { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
.char-dots .dot { width: 8px; height: 8px; background: var(--border-strong); }
.char-dots .dot.on { background: var(--gold); }
.char-portrait { height: 230px; text-align: center; position: relative; z-index: 100; }
.char-portrait img { height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.45)); }
.char-head {
  width: 26px; height: 26px; object-fit: cover;
  border: 2px solid var(--border-strong); background: var(--bg-dark);
  vertical-align: -8px;
}
.char-head.sm { width: 20px; height: 20px; vertical-align: -6px; }
.char-flavor-card { display: flex; gap: 16px; align-items: flex-start; position: relative; z-index: 100; }
.char-flavor-art { flex: 0 0 96px; position: relative; z-index: 100; }
.char-flavor-art img { width: 96px; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.45)); }
.char-flavor-text { flex: 1; min-width: 0; }
.char-list .btn { margin-bottom: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px; }
.char-avatar-big { font-size: 40px; text-align: center; line-height: 1.3; }
.char-title { color: var(--text-dim); font-weight: 400; }
.char-tier { font-size: 0.72rem; font-weight: 700; }
.char-tier.tier-light { color: var(--green); }
.char-tier.tier-bold { color: var(--red); }
.char-tier.tier-growth { color: #c980ff; }
.char-abilities {
  font-size: 0.74rem; color: var(--gold);
  border-top: 2px dashed var(--border); padding-top: 6px; margin-top: 2px;
}
.char-note {
  margin-top: 10px; padding: 8px 12px;
  border: 2px dashed var(--gold);
  font-size: 0.85rem; color: var(--gold);
}
@media (min-width: 1024px) {
  .char-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; overflow-x: visible; padding: 0; }
  .char-list .btn { flex: none; max-width: none; }
  .char-swipe-hint, .char-dots, .char-stage { display: none; }
  .char-card .char-portrait { display: flex; align-items: flex-end; justify-content: center; }
  /* 全身立绘出血占满卡片上半区：档位色脚光台 + 底部渐隐 */
  .char-portrait {
    height: 330px; margin: -12px -12px 10px;
    background: radial-gradient(ellipse 62% 34% at 50% 88%, rgba(91, 150, 219, 0.22), transparent 72%);
  }
  .tier-light .char-portrait { background: radial-gradient(ellipse 62% 34% at 50% 88%, rgba(123, 216, 138, 0.20), transparent 72%); }
  .tier-bold .char-portrait { background: radial-gradient(ellipse 62% 34% at 50% 88%, rgba(232, 93, 93, 0.20), transparent 72%); }
  .tier-growth .char-portrait { background: radial-gradient(ellipse 62% 34% at 50% 88%, rgba(201, 128, 255, 0.22), transparent 72%); }
  .char-portrait img {
    height: 96%; width: auto; max-width: 100%; object-fit: contain;
    filter: drop-shadow(3px 4px 0 rgba(0, 0, 0, 0.45));
    transition: transform 0.18s ease;
  }
  .char-card:hover .char-portrait img { transform: translateY(-8px) scale(1.03); }
  .char-card .btn-title { font-size: 1.02rem; }
  .char-flavor-art { flex-basis: 130px; }
  .char-flavor-art img { width: 130px; }
  .char-head { width: 30px; height: 30px; }
}

/* ---------- 开场白 ---------- */
.intro-wrap {
  min-height: calc(100vh - 60px);
  display: flex; flex-direction: column; justify-content: center;
}
.intro-hero { will-change: transform; }
.intro-hero .title-banner { margin: 0 0 18px; }
.intro-narration { animation: fadeIn 0.6s steps(6); }
.intro-narration .scene { color: var(--text); }
.intro-fade { transition: opacity 0.4s; }
.intro-fade.out { opacity: 0; }

/* ---------- 开局 ---------- */
.title-hero {
  text-align: center; margin: 36px 0 8px; font-size: 1.9rem; font-weight: 800;
  letter-spacing: 6px;
  color: var(--gold);
  text-shadow: 3px 3px 0 var(--shadow);
}
.title-hero-sub { text-align: center; color: var(--text-dim); margin-bottom: 28px; }
.title-hero-sub::after { content: "▮"; margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.idea-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.idea-stat {
  font-size: 0.8rem; color: var(--text-dim);
  background: var(--bg-dark); border: 2px solid var(--border);
  padding: 1px 8px;
}

/* ---------- 美术资产 ---------- */
.px-img { image-rendering: pixelated; display: inline-block; }
.title-banner {
  position: relative; overflow: hidden;
  border: 2px solid var(--border-strong); border-radius: 6px;
  margin: 24px 0 10px;
  animation: neonBreath 4.5s ease-in-out infinite;
}
.title-banner img { width: 100%; display: block; image-rendering: pixelated; }
.title-banner .title-hero {
  position: absolute; left: 0; right: 0; bottom: 6%;
  margin: 0; font-size: 1.9rem;
}
@keyframes neonBreath {
  0%, 100% { box-shadow: 0 0 6px rgba(91,150,219,0.12); }
  50% { box-shadow: 0 0 20px rgba(91,150,219,0.35); }
}
.idea-visual { text-align: center; margin-bottom: 8px; }
.idea-visual img {
  width: 96px; height: 96px; image-rendering: pixelated;
  transition: transform 0.12s steps(3);
}
.idea-visual .idea-emoji { font-size: 52px; line-height: 96px; }
.hud-logo { width: 28px; height: 28px; vertical-align: -7px; margin-right: 6px; }
.attr-icon { width: 20px; height: 20px; vertical-align: -4px; }
/* 结算印章：结果面板角落盖章，成/平/败 叠字 */
.result-card { position: relative; }
.stamp {
  position: absolute; top: 8px; right: 10px;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-8deg);
  animation: stampIn 0.2s steps(4);
  pointer-events: none;
}
.stamp img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.stamp .stamp-char { position: relative; font-weight: 800; font-size: 19px; line-height: 1; }
.stamp.success .stamp-char { color: #3d9c50; }
.stamp.mid .stamp-char { color: #8a8a8a; }
.stamp.fail .stamp-char { color: #d14a6b; }
.stamp.no-img { border: 3px solid; border-radius: 50%; }
.stamp.no-img.success { border-color: #3d9c50; background: rgba(61,156,80,0.08); }
.stamp.no-img.mid { border-color: #8a8a8a; background: rgba(138,138,138,0.08); }
.stamp.no-img.fail { border-color: #d14a6b; background: rgba(209,74,107,0.08); }
@keyframes stampIn {
  0% { transform: scale(1.6) rotate(-14deg); opacity: 0; }
  60% { transform: scale(0.95) rotate(-4deg); opacity: 1; }
  100% { transform: scale(1) rotate(-8deg); }
}
/* 轮次徽章（badge_round 叠轮次字） */
.stage-badge-img {
  position: relative; display: inline-block;
  width: 24px; height: 24px; margin-left: 8px; vertical-align: -6px;
}
.stage-badge-img img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.stage-badge-img.unfunded { opacity: 0.3; filter: grayscale(1); }
.stage-badge-img .round-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; color: #fff; line-height: 1;
  text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
}
.stage-badge-img.lg { width: 48px; height: 48px; margin: 10px auto 0; display: block; vertical-align: 0; }
.stage-badge-img.lg .round-text { font-size: 14px; }
/* 融资弹层主图 */
.funding-hero {
  display: block; width: 200px; height: 200px; margin: 0 auto;
  image-rendering: pixelated;
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.funding-emoji { font-size: 76px; text-align: center; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
/* 节点页阶段横幅 */
.phase-banner {
  position: relative; height: 100px; margin-bottom: 18px;
  border: 3px solid var(--border); box-shadow: 4px 4px 0 var(--shadow);
  background-size: cover; background-position: center;
  image-rendering: pixelated;
  display: flex; flex-direction: column; justify-content: flex-end;
  animation: fadeIn 0.25s steps(4);
}
.phase-banner::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
.phase-banner .pb-time { position: relative; font-size: 1.15rem; font-weight: 800; padding: 0 14px 0; text-shadow: 2px 2px 0 #000; }
.phase-banner .pb-sub { position: relative; color: #d8d5cc; font-size: 0.8rem; padding: 0 14px 8px; text-shadow: 1px 1px 0 #000; }
/* 阶段转场（全屏 1.5s） */
#phase-transition {
  position: fixed; inset: 0; z-index: 50;
  background-size: cover; background-position: center;
  image-rendering: pixelated;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: fadeIn 0.3s steps(4);
}
#phase-transition .pt-name {
  font-size: 2.1rem; font-weight: 800; color: #fff;
  letter-spacing: 8px; text-shadow: 3px 3px 0 #000;
}
#phase-transition .pt-sub { margin-top: 8px; color: #fff; text-shadow: 2px 2px 0 #000; }
#phase-transition.fade-out { animation: fadeOutT 0.3s steps(4) forwards; }
@keyframes fadeOutT { to { opacity: 0; } }
/* 天然 20 / 天然 1 特效图 */
.crit-fx {
  position: absolute; top: -40px; left: 50%; margin-left: -44px;
  width: 88px; height: 88px; z-index: 5;
  image-rendering: pixelated; pointer-events: none;
  animation: critFx 1.4s steps(7) forwards;
}
@keyframes critFx {
  0% { transform: scale(0.5); opacity: 0; }
  15% { transform: scale(1.1); opacity: 1; }
  60% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}
/* 百搭卡卡框版式：白色内窗 + 金色像素框 */
.wildcard.framed {
  position: relative;
  border: none; box-shadow: none; background-color: transparent;
  background-size: 100% 100%; background-repeat: no-repeat;
  image-rendering: pixelated;
  max-width: 352px; min-height: 500px;
  padding: 96px 58px 64px;
  color: #33291c;
  overflow-y: visible;
}
.wildcard.framed .wildcard-tag {
  position: absolute; top: 30px; left: 0; right: 0;
  background: none; color: #7a5a17; text-align: center;
  font-size: 0.75rem; padding: 0; margin: 0;
}
.wildcard.framed h2 { color: #33291c; text-align: center; font-size: 1rem; }
.wildcard.framed h2::before { content: ""; }
.wildcard.framed .scene { color: #40372a; font-size: 0.88rem; }
.wildcard.framed .dim { color: #6f6552; }

/* 悬停态只在鼠标设备生效，避免触屏上点击后的粘滞高亮 */
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
  .btn:hover .btn-title::before { content: "▶ "; color: var(--accent); }
  .btn-primary:hover { background: #f8d078; border-color: #f8d078; color: #1a1400; }
  .btn-ipo:hover .btn-title::before { content: "◆ "; color: var(--gold); }
  .btn:hover .idea-visual img { transform: scale(1.05); }
}

#lang-switch {
  position: fixed; bottom: 10px; right: 10px; z-index: 120;
  font-size: 0.78rem; color: var(--text-dim);
  border: 2px solid var(--border-strong); padding: 2px 8px;
  background: var(--bg-card); text-decoration: none;
}
#lang-switch:hover { color: var(--gold); border-color: var(--gold); }

/* ---------- debug ---------- */
#debug-panel {
  border: 2px dashed var(--red);
  padding: 8px 12px; margin-bottom: 12px;
  font-size: 0.8rem; color: var(--red);
  font-family: ui-monospace, monospace;
}

@media (max-width: 480px) {
  #stats { grid-template-columns: 1fr; gap: 6px; }
  #app { padding: 10px; }
  .card { padding: 14px; }
  .title-hero { letter-spacing: 3px; }
}

/* ---------- 桌面端（≥1024px）：HUD 侧栏 + 三列卡片 + 键盘操作 ---------- */
.key-hint { display: none; color: var(--text-dim); margin-right: 6px; }
@media (min-width: 1024px) {
  #app { max-width: 1080px; padding: 24px; }
  /* 数值区仍在顶部：现金一整行，其余四维并排一行 */
  #app.playing #stats { grid-template-columns: repeat(4, 1fr); gap: 8px 20px; }
  .idea-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: stretch; }
  .idea-list .btn { margin-bottom: 0; display: flex; flex-direction: column; }
  .idea-list .btn .btn-sub { flex: 1; }
  /* 节点选项：三列等高卡片 */
  .choice-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: stretch; }
  .choice-list .btn { margin-bottom: 0; display: flex; flex-direction: column; gap: 6px; }
  .choice-list .btn .btn-sub { flex: 1; }
  .choice-list .btn-ipo { grid-column: 1 / -1; }
  .phase-banner { height: 150px; }
  .key-hint { display: inline; }
}
</style>

/* ============================================================
   assets —— 美术资产加载（webp→png 探测，缺图降级 emoji）
   ============================================================ */
const ASSET_IDS = ["title", "idea_ai", "idea_brand", "idea_ring",
  "char_chen", "char_su", "char_kathy", "char_gu", "char_luna", "char_wang",
  "char_chen_head", "char_su_head", "char_kathy_head", "char_gu_head", "char_luna_head", "char_wang_head",
  "attr_cash", "attr_team", "attr_network", "attr_health", "attr_traction",
  "stamp_success", "stamp_mid", "stamp_fail", "fx_crit_success", "fx_crit_fail",
  "card_frame", "badge_round", "fx_funding", "phase_1", "phase_2", "phase_3"];
const ASSETS = {};
const IDEA_EMOJI = { ai: "🙏", brand: "🧃", ring: "💍" };

function probeAsset(id) {
  return new Promise(resolve => {
    const exts = ["webp", "png"];
    let i = 0;
    const tryNext = () => {
      if (i >= exts.length) { ASSETS[id] = null; resolve(); return; }
      const url = `assets/${id}.${exts[i++]}`;
      const img = new Image();
      img.onload = () => { ASSETS[id] = url; resolve(); };
      img.onerror = tryNext;
      img.src = url;
    };
    tryNext();
  });
}

// 全部探测完成（或超时 3s）后再进开始页，避免图标闪现
function loadAssets() {
  return Promise.race([
    Promise.all(ASSET_IDS.map(probeAsset)),
    new Promise(r => setTimeout(r, 3000)),
  ]);
}

const ATTRS = ["cash", "traction", "team", "network", "health"];
const ATTR_META = {
  cash:     { icon: "💰", name: "자금" },
  traction: { icon: "📈", name: "트랙션" },
  team:     { icon: "👥", name: "팀" },
  network:  { icon: "🤝", name: "인맥" },
  health:   { icon: "❤️", name: "건강" },
};
const WARN_AT = { cash: 8, traction: 5, team: 20, network: 20, health: 20 };
const TOTAL_NODES = 27;
const WILDCARD_CHANCE = { 1: 0.30, 2: 0.40, 3: 0.50 };
const CRIT_SUCCESS_PREFIX = "🎉 대박이 터졌다!";
const CRIT_FAIL_PREFIX = "💀 엎친 데 덮쳤다!";
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

/* ============================================================
   state —— 游戏状态（全部内存，不使用任何存储）
   ============================================================ */
let state = null;

function newState(idea, char) {
  const stats = {};
  for (const k of ["cash", "traction", "team", "network", "health"]) {
    const v = idea.stats[k] + ((char && char.statMod[k]) || 0);
    stats[k] = k === "cash" ? Math.max(0, v) : Math.max(0, Math.min(100, v));
  }
  return {
    idea,
    char: char || null,
    wrongPages: 0,            // 错题本页数（王进步）
    stats,
    node: 0,                  // 当前节点（1–27）
    stage: 0,                 // 已完成的融资轮次数（0=未融资）
    lastChoiceIds: [],
    taken: new Set(),         // 本局已选过的行动 id（用于 once / requires）
    acqOffers: 0,             // 已出现过的收购要约次数
    ipoPrepYear: null,        // 启动上市筹备的年份（7–10），null=从未启动
    usedWildcards: new Set(),
    log: [],                  // { node, time, title, tier }
    funding: [],              // { time, name, amount }
    critSuccessCount: 0,
    lastFlow: null,           // 最近一次的现金流明细 { burn, rev, net }
    over: false,
  };
}

/* ============================================================
   engine —— 推进 / 掷骰 / 现金流 / 融资 / 结算
   ============================================================ */
function phaseOfNode(node) {
  if (node <= 12) return 1;
  if (node <= 20) return 2;
  return 3;
}

function timeLabel(node) {
  if (node <= 12) return `1년차 ${node}월`;
  if (node <= 20) {
    const idx = node - 13;
    return `${2 + Math.floor(idx / 4)}년차 ${(idx % 4) + 1}분기`;
  }
  return `${node - 17}년차`;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// 角色钩子辅助
function hasSpecial(key) { return !!(state.char && state.char.special.includes(key)); }

// 角色掷骰修正：rollMod 按 checkAttr 匹配 + 王进步的阶段成长全局修正
function charRollMod(checkAttr) {
  const c = state.char;
  if (!c) return 0;
  let m = (checkAttr && c.rollMod[checkAttr]) || 0;
  if (c.special.includes("phaseRollGrowth")) {
    const ph = phaseOfNode(state.node);
    m += ph === 2 ? 1 : ph === 3 ? 2 : 0;
  }
  return m;
}

// 角色 fxMod：先算百分比、向上取整（损失至少仍 1 点），再进常规结算
function charFx(fx, opts) {
  const c = state.char;
  if (!c || !c.fxMod.length) return fx;
  const out = { ...fx };
  for (const m of c.fxMod) {
    if (m.type === "cashLoss" && (out.cash || 0) < 0) out.cash = -Math.max(1, Math.ceil(-out.cash * m.mult));
    if (m.type === "tractionGain" && (out.traction || 0) > 0) out.traction = Math.ceil(out.traction * m.mult);
    if (m.type === "failNetworkLoss" && opts && opts.fail && (out.network || 0) < 0) out.network = -Math.ceil(-out.network * m.mult);
  }
  return out;
}

// 融资分 = 数据×2 + 团队 + 人脉 + 角色加成（不含现金/健康）
function fundScore() {
  return state.stats.traction * 2 + state.stats.team + state.stats.network
    + (hasSpecial("fundScoreBonus15") ? 15 : 0);
}

// 每节点现金流：时间粒度越粗、轮次越晚，烧钱越多；数据带来收入
function cashflow() {
  const phase = phaseOfNode(state.node);
  const tr = state.stats.traction;
  // C 轮（第 4 轮）后烧钱显著加码：规模的代价
  const stageMult = 1 + state.stage * 0.4 + Math.max(0, state.stage - 3) * 0.5;
  let burn, rev;
  if (phase === 1) { burn = Math.ceil(1 * stageMult); rev = Math.floor(tr / 8); }
  else if (phase === 2) { burn = Math.ceil(2.5 * stageMult); rev = Math.floor(tr * tr / 250); }
  else { burn = Math.ceil(10 * stageMult); rev = Math.floor(tr * tr / 160); }
  return { burn, rev, net: rev - burn };
}

// 节点开始结算：现金流 + 体力消耗 + 角色节点被动（角色被动掉血最低扣到 1，不致死）
function nodeStartEffects() {
  const flow = cashflow();
  flow.drain = phaseOfNode(state.node) === 1 ? 1 : phaseOfNode(state.node) === 2 ? 3 : 8;
  state.lastFlow = flow;
  const applied = {};
  const bCash = state.stats.cash;
  state.stats.cash = Math.max(0, bCash + flow.net);
  if (state.stats.cash !== bCash) applied.cash = state.stats.cash - bCash;
  const bHealth = state.stats.health;
  let h = clamp(bHealth - flow.drain, 0, 100);
  if (hasSpecial("drainHealthEvenNode") && state.node % 2 === 0 && h > 1) h = Math.max(1, h - 1);
  state.stats.health = h;
  if (h !== bHealth) applied.health = h - bHealth;
  if (hasSpecial("tractionOddNode") && state.node % 3 === 0) {
    const bt = state.stats.traction;
    state.stats.traction = clamp(bt + 1, 0, 100);
    if (state.stats.traction !== bt) applied.traction = state.stats.traction - bt;
  }
  return applied;
}

// 属性修正：clamp(floor((关联属性-50)/15), -3, +3)；现金超过 100 按 100 计
function attrMod(checkAttr) {
  if (!checkAttr) return 0;
  const v = Math.min(state.stats[checkAttr], 100);
  return clamp(Math.floor((v - 50) / 15), -3, 3);
}

// 应用 fx（可选倍率）。现金下限 0 无上限，其余 0–100
function applyFx(fx, mult) {
  mult = mult || 1;
  const applied = {};
  for (const attr of ATTRS) {
    let delta = fx[attr] || 0;
    if (delta !== 0 && mult !== 1) {
      delta = Math.sign(delta) * Math.ceil(Math.abs(delta) * mult);
    }
    if (delta !== 0) {
      const before = state.stats[attr];
      const after = attr === "cash" ? Math.max(0, before + delta) : clamp(before + delta, 0, 100);
      state.stats[attr] = after;
      applied[attr] = after - before;
    }
  }
  return applied;
}

// 归零检查（数据不致死），多属性同时归零按 健康>现金>团队>人脉 优先
function checkZero() {
  for (const attr of ["health", "cash", "team", "network"]) {
    if (state.stats[attr] <= 0) return attr;
  }
  return null;
}

// 达标自动关轮（可能连关多轮），返回本次新完成的轮次列表
function checkFunding() {
  const closed = [];
  while (state.stage < ROUNDS.length && fundScore() >= ROUNDS[state.stage].target) {
    const round = ROUNDS[state.stage];
    state.stats.cash += round.amount;
    state.stats.health = clamp(state.stats.health + 6, 0, 100);
    state.stage++;
    state.funding.push({ time: timeLabel(Math.max(state.node, 1)), name: round.name, amount: round.amount });
    state.log.push({ node: state.node, time: timeLabel(Math.max(state.node, 1)), title: `${round.name} ${round.amount}억 입금`, tier: "fund" });
    closed.push(round);
  }
  return closed;
}

// 点子匹配：ideaOnly 可为 null（通用）、字符串（单线）或数组（多线）
function fitsIdea(entry) {
  if (!entry.ideaOnly) return true;
  return Array.isArray(entry.ideaOnly) ? entry.ideaOnly.includes(state.idea.id) : entry.ideaOnly === state.idea.id;
}

// 抽取选项：阶段 + 点子 + 轮次门槛 + once/前置解锁，排除上一节点展示过的
function drawChoices() {
  const phase = phaseOfNode(state.node);
  const pool = ACTIONS.filter(a =>
    a.phase === phase &&
    fitsIdea(a) &&
    (a.minStage === undefined || state.stage >= a.minStage) &&
    (a.maxStage === undefined || state.stage <= a.maxStage) &&
    (!a.once || !state.taken.has(a.id)) &&
    (!a.requires || a.requires.every(r => state.taken.has(r)))
  );
  let candidates = pool.filter(a => !state.lastChoiceIds.includes(a.id));
  if (candidates.length < 3) candidates = pool.slice();
  const picked = [];
  const bag = candidates.slice();
  while (picked.length < 3 && bag.length > 0) {
    const i = Math.floor(Math.random() * bag.length);
    picked.push(bag.splice(i, 1)[0]);
  }
  state.lastChoiceIds = picked.map(a => a.id);
  return picked;
}

// 合并两个 applyFx 返回的变化量
function mergeApplied(applied, extra) {
  for (const k in extra) applied[k] = (applied[k] || 0) + extra[k];
}

// d20 判定（天然骰优先）；角色 rollMod 与属性修正叠加后夹紧 ±5
function resolveAction(action) {
  const roll = Math.floor(Math.random() * 20) + 1;
  const mod = clamp(attrMod(action.checkAttr) + charRollMod(action.checkAttr), -5, 5);
  const total = roll + mod;
  let tier, outcome, mult = 1, prefix = "";
  if (roll === 20) {
    tier = "crit_success"; outcome = action.success; prefix = CRIT_SUCCESS_PREFIX;
    // 厚积薄发：王进步阶段三的大成功倍率 ×2
    mult = (hasSpecial("lateGameCritX2") && phaseOfNode(state.node) === 3) ? 2 : 1.5;
    state.critSuccessCount++;
  } else if (roll === 1) {
    tier = "crit_fail"; outcome = action.fail; mult = 1.5; prefix = CRIT_FAIL_PREFIX;
  } else if (total >= action.S) {
    tier = "success"; outcome = action.success;
  } else if (total >= action.F) {
    tier = "mid"; outcome = action.mid;
  } else {
    tier = "fail"; outcome = action.fail;
  }
  const isFail = tier === "fail" || tier === "crit_fail";
  const fx = charFx(outcome.fx, { fail: isFail });
  const applied = applyFx(fx, mult);
  const notes = [];
  if (tier === "crit_success") {
    const heal = applyFx({ health: 4 });
    mergeApplied(applied, heal);
    // C 轮后的时来运转：数据收益额外翻倍（规模效应）
    if (state.stage >= 4 && (fx.traction || 0) > 0) {
      mergeApplied(applied, applyFx({ traction: fx.traction }));
    }
    // 热搜体质：大成功额外 数据+5 人脉+5
    if (hasSpecial("critAmplify")) {
      mergeApplied(applied, applyFx({ traction: 5, network: 5 }));
      notes.push("📱 실시간 검색어 진입! 트래픽과 인맥이 동시에 떡상.");
    }
  }
  if (tier === "crit_fail" && hasSpecial("critAmplify")) {
    // 热搜体质：大失败额外 人脉-5 健康-5（被动扣减最低扣到 1，不致死）
    const nLoss = Math.min(5, Math.max(0, state.stats.network - 1));
    const hLoss = Math.min(5, Math.max(0, state.stats.health - 1));
    mergeApplied(applied, applyFx({ network: -nLoss, health: -hLoss }));
    notes.push("📱 대형 사고 영상이 실검 1위에 박제됐다.");
  }
  // 错题本：失败也在喂它
  if (isFail && hasSpecial("wrongAnswerBook")) {
    state.wrongPages++;
    if (state.wrongPages % 2 === 0) {
      const order = ["health", "cash", "team", "network", "traction"];
      let lowest = order[0];
      for (const a of order) if (state.stats[a] < state.stats[lowest]) lowest = a;
      mergeApplied(applied, applyFx({ [lowest]: 6 }));
      notes.push(`✏️ 이 문제, 다시는 안 틀린다. (${ATTR_META[lowest].name} +6)`);
    } else {
      notes.push("📖 오답노트가 한 장 더 두꺼워졌다.");
    }
  }
  state.taken.add(action.id);
  state.log.push({ node: state.node, time: timeLabel(state.node), title: action.title, tier });
  return { roll, mod, total, tier, prefix, text: outcome.text, applied, notes };
}

// 抽百搭卡（可能返回 null）
function maybeDrawWildcard() {
  const phase = phaseOfNode(state.node);
  if (Math.random() >= WILDCARD_CHANCE[phase]) return null;
  const available = WILDCARDS.filter(w =>
    !state.usedWildcards.has(w.id) &&
    (!w.phase || w.phase.includes(phase)) &&
    fitsIdea(w)
  );
  if (available.length === 0) return null;
  const card = available[Math.floor(Math.random() * available.length)];
  state.usedWildcards.add(card.id);
  return card;
}

// 十年结局判定（严格从上到下，命中即停）
function judgeFinalEnding() {
  const ctx = { stage: state.stage, crits: state.critSuccessCount, prepYear: state.ipoPrepYear };
  for (const e of ENDINGS.final) {
    if (e.cond(state.stats, ctx)) return e;
  }
  return ENDINGS.final[ENDINGS.final.length - 1];
}

/* ============================================================
   ui —— 渲染
   ============================================================ */
const $hud = document.getElementById("hud");
const $main = document.getElementById("main");
const $stats = document.getElementById("stats");
const $hudInfo = document.getElementById("hud-info");
const $timeLabel = document.getElementById("time-label");
const $progressLabel = document.getElementById("progress-label");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* 移动端幽灵点击防护：界面切换后 350ms 内忽略真实触点，
   防止弹层在手指坐标下方生成时被补发的合成点击误触
   （合成 click()（键盘操作）isTrusted=false，不受影响） */
let uiGuardUntil = 0;
function armUiGuard() { uiGuardUntil = Date.now() + 350; }
document.addEventListener("click", e => {
  if (e.isTrusted && Date.now() < uiGuardUntil) {
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

function stageName() {
  return state.stage === 0 ? "투자 전" : ROUNDS[state.stage - 1].name;
}

const ROUND_SHORT = ["시드", "A", "B", "C", "D", "E"];
const PHASE_META = {
  1: { name: "생존기", sub: "1년차 · 버티면 산다" },
  2: { name: "성장기", sub: "2–3년차 · 크거나 죽거나" },
  3: { name: "성숙기", sub: "4–10년차 · 노병은 죽지 않는다" },
};

// 轮次徽章：badge_round 叠轮次字，未融资置灰；缺图降级文字标签
function stageBadgeHtml(cls) {
  const url = ASSETS.badge_round;
  if (!url) return `<span class="stage-badge">${esc(stageName())}</span>`;
  const funded = state.stage > 0;
  return `<span class="stage-badge-img ${cls || ""} ${funded ? "" : "unfunded"}" title="${esc(stageName())}">
    <img src="${url}" alt=""><span class="round-text">${funded ? esc(ROUND_SHORT[state.stage - 1]) : ""}</span></span>`;
}

function attrValueText(attr, v) {
  return attr === "cash" ? `${v}억` : String(v);
}

// 角色立绘 / 头像（插画风，不做像素化渲染；缺图降级 emoji）
function charPortraitHtml(c) {
  const url = ASSETS["char_" + c.id];
  return url
    ? `<div class="char-portrait"><img src="${url}" alt="${esc(c.name)}"></div>`
    : `<div class="char-avatar-big">${c.emoji}</div>`;
}
function charHeadHtml(c, cls) {
  const url = ASSETS["char_" + c.id + "_head"];
  return url
    ? `<img class="char-head ${cls || ""}" src="${url}" alt="${esc(c.name)}" title="${esc(c.name)}">`
    : `<span title="${esc(c.name)}">${c.emoji}</span>`;
}

// 属性图标：有素材用像素图，缺图降级 emoji
function attrIconHtml(attr) {
  const url = ASSETS["attr_" + attr];
  return url ? `<img class="attr-icon px-img" src="${url}" alt="${ATTR_META[attr].name}">` : ATTR_META[attr].icon;
}

// 点子主图：素材 96×96，缺图降级大号 emoji
function ideaVisualHtml(ideaId) {
  const url = ASSETS["idea_" + ideaId];
  return `<div class="idea-visual">${url
    ? `<img src="${url}" alt="">`
    : `<span class="idea-emoji">${IDEA_EMOJI[ideaId]}</span>`}</div>`;
}

function fxTags(applied) {
  const tags = [];
  for (const attr of ATTRS) {
    const d = applied[attr];
    if (!d) continue;
    const m = ATTR_META[attr];
    const unit = attr === "cash" ? "M" : "";
    tags.push(`<span class="fx-tag ${d > 0 ? "pos" : "neg"}">${m.icon} ${m.name} ${d > 0 ? "+" : ""}${d}${unit}</span>`);
  }
  return tags.length ? `<div class="fx-list">${tags.join("")}</div>` : "";
}

function statBlock(attr, extraClass) {
  const v = state.stats[attr];
  const m = ATTR_META[attr];
  const warn = v <= WARN_AT[attr] ? "warning" : "";
  const over = attr === "cash" && v > 100 ? "overflow" : "";
  const width = Math.min(v, 100);
  return `<div class="stat ${warn} ${over} ${extraClass || ""}" data-attr="${attr}">
    <div class="stat-head">
      <span class="stat-name">${attrIconHtml(attr)} ${m.name}</span>
      <span class="stat-value">${attrValueText(attr, v)}</span>
    </div>
    <div class="stat-bar"><div class="stat-fill" style="width:${width}%"></div></div>
  </div>`;
}

function renderHUD(applied) {
  $hud.style.display = "block";
  document.getElementById("app").classList.add("playing");
  const logoUrl = ASSETS["idea_" + state.idea.id];
  const logoHtml = logoUrl ? `<img class="hud-logo px-img" src="${logoUrl}" alt="">` : "";
  $timeLabel.innerHTML = `${logoHtml}${esc(timeLabel(state.node))}${stageBadgeHtml()}`;
  $progressLabel.innerHTML = `${state.char ? charHeadHtml(state.char) + " " : ""}분기 ${state.node}/${TOTAL_NODES}`;
  $stats.innerHTML = ATTRS.map(a => statBlock(a)).join("");
  const flow = state.lastFlow;
  const flowHtml = flow
    ? `<span>이번 턴 현금흐름 <span class="${flow.net >= 0 ? "pos" : "neg"}">${flow.net >= 0 ? "+" : ""}${flow.net}억</span> (지출 ${flow.burn}억 / 수익 ${flow.rev}억) ｜ 체력 <span class="neg">-${flow.drain}</span></span>`
    : "<span></span>";
  const fundHtml = state.stage < ROUNDS.length
    ? `<span class="fund-progress">다음 라운드 ${esc(ROUNDS[state.stage].name)} ${ROUNDS[state.stage].amount}억 ｜ 투자 점수 ${fundScore()}/${ROUNDS[state.stage].target}</span>`
    : `<span class="fund-progress">모든 라운드 클리어 · 자본시장에 더 배울 게 없다</span>`;
  $hudInfo.innerHTML = flowHtml + fundHtml;
  if (applied) {
    for (const attr of ATTRS) {
      const d = applied[attr];
      if (!d) continue;
      const el = $stats.querySelector(`.stat[data-attr="${attr}"]`);
      if (!el) continue;
      const f = document.createElement("span");
      f.className = "float-fx " + (d > 0 ? "pos" : "neg");
      f.textContent = (d > 0 ? "+" : "") + d + (attr === "cash" ? "억" : "");
      el.appendChild(f);
      setTimeout(() => f.remove(), 1600);
    }
  }
}

function debugPanel(info) {
  if (!DEBUG || !info) return "";
  return `<div id="debug-panel">[debug] roll=${info.roll} mod=${info.mod >= 0 ? "+" : ""}${info.mod} total=${info.total} ｜ S=${info.S} F=${info.F} ｜ tier=${info.tier} ｜ score=${fundScore()} stage=${state.stage}</div>`;
}

  document.getElementById("intro-go").addEventListener("click", introTransition);
}

// 开场转场：背景图上移到开局页位置，文案淡出，随后进入点子选择
function introTransition() {
  const hero = $main.querySelector(".intro-hero");
  const dy = hero.getBoundingClientRect().top - 16;
  hero.style.transition = "transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)";
  hero.style.transform = `translateY(${-dy}px)`;
  $main.querySelectorAll(".intro-fade").forEach(el => el.classList.add("out"));
  setTimeout(showStart, 730);
}

/* ---------- 开局 ---------- */
function showStart() {
  state = null;
  $hud.style.display = "none";
  document.getElementById("app").classList.remove("playing");
  const heroHtml = ASSETS.title
    ? `<div class="title-banner"><img src="${ASSETS.title}" alt=""><div class="title-hero">스타트업 시뮬레이터</div></div>`
    : `<div class="title-hero">스타트업 시뮬레이터</div>`;
  $main.innerHTML = `
    ${heroHtml}
    <div class="title-hero-sub">십 년짜리 창업의 꿈 — 아이템 하나 골라, 맨손으로 시작하라.</div>
    <div class="idea-list">
    ${IDEAS.map((idea, i) => `
      <button class="btn" data-idea="${idea.id}">
        ${ideaVisualHtml(idea.id)}
        <div class="btn-title"><span class="key-hint">[${i + 1}]</span>${esc(idea.name)}</div>
        <div class="btn-sub">${esc(idea.desc)}</div>
        <div class="idea-stats">${ATTRS.map(a =>
          `<span class="idea-stat">${ATTR_META[a].icon} ${ATTR_META[a].name} ${attrValueText(a, idea.stats[a])}</span>`).join("")}
        </div>
      </button>`).join("")}
    </div>
  `;
  armUiGuard();
  $main.querySelectorAll("[data-idea]").forEach(btn => {
    btn.addEventListener("click", () => {
      const idea = IDEAS.find(i => i.id === btn.dataset.idea);
      showCharSelect(idea);
    });
  });
}

/* ---------- 角色选择 ---------- */
function showCharSelect(idea) {
  $main.innerHTML = `
    <div class="title-hero" style="font-size:1.3rem;margin:20px 0 4px">창업자를 선택하세요</div>
    <div class="title-hero-sub">${esc(idea.name)}</div>
    <div class="char-stage">
      ${CHARACTERS.map((c, i) => {
        const url = ASSETS["char_" + c.id];
        return url
          ? `<img class="stage-art" data-si="${i}" src="${url}" alt="">`
          : `<div class="stage-art emoji-layer" data-si="${i}">${c.emoji}</div>`;
      }).join("")}
    </div>
    <div class="char-swipe-hint">◀ 좌우로 넘겨 창업자 보기 ▶</div>
    <div class="char-list">
      ${CHARACTERS.map((c, i) => `
        <button class="btn char-card tier-${c.tier}" data-char="${c.id}">
          ${charPortraitHtml(c)}
          <div class="btn-title"><span class="key-hint">[${i + 1}]</span>${esc(c.name)}<span class="char-title">「${esc(c.title)}」</span></div>
          <div class="char-tier tier-${c.tier}">${TIER_META[c.tier].icon} ${TIER_META[c.tier].name}</div>
          <div class="btn-sub">${esc(c.desc)}</div>
          <div class="char-abilities">${esc(c.abilities)}</div>
        </button>`).join("")}
    </div>
    <div class="char-dots">${CHARACTERS.map((c, i) => `<span class="dot${i === 0 ? " on" : ""}"></span>`).join("")}</div>
  `;
  window.scrollTo(0, 0);
  armUiGuard();
  // 滑动进度驱动：文字卡跟随滚动，立绘在舞台原位交叉替换（淡入淡出 + 视差 + 缩放）
  const list = $main.querySelector(".char-list");
  const dots = $main.querySelectorAll(".char-dots .dot");
  const layers = $main.querySelectorAll(".char-stage .stage-art");
  const cards = $main.querySelectorAll(".char-card");
  function updateStage() {
    const viewCenter = list.scrollLeft + list.clientWidth / 2;
    let active = 0, best = Infinity;
    cards.forEach((card, i) => {
      const d = (card.offsetLeft + card.offsetWidth / 2 - viewCenter) / card.offsetWidth;
      const layer = layers[i];
      if (layer) {
        const abs = Math.abs(d);
        layer.style.opacity = Math.max(0, 1 - abs * 1.3).toFixed(3);
        layer.style.transform = `translateX(calc(-50% + ${(-d * 72).toFixed(1)}px)) scale(${(1 - Math.min(0.14, abs * 0.12)).toFixed(3)})`;
      }
      if (Math.abs(d) < best) { best = Math.abs(d); active = i; }
    });
    dots.forEach((dt, j) => dt.classList.toggle("on", j === active));
  }
  list.addEventListener("scroll", () => requestAnimationFrame(updateStage), { passive: true });
  updateStage();
  $main.querySelectorAll("[data-char]").forEach(btn => {
    btn.addEventListener("click", () => {
      const char = CHARACTERS.find(c => c.id === btn.dataset.char);
      state = newState(idea, char);
      showFlavor(idea);
    });
  });
}

function showFlavor(idea) {
  const c = state.char;
  $main.innerHTML = `
    <div class="card">
      <h2>${esc(idea.name)}</h2>
      <p class="scene">${esc(idea.flavor)}</p>
    </div>
    <div class="card char-flavor-card">
      ${ASSETS["char_" + c.id] ? `<div class="char-flavor-art"><img src="${ASSETS["char_" + c.id]}" alt=""></div>` : ""}
      <div class="char-flavor-text">
      <h2>${ASSETS["char_" + c.id] ? "" : c.emoji + " "}${esc(c.name)}「${esc(c.title)}」</h2>
      <p class="scene">${esc(c.quote)}</p>
      <p class="dim" style="margin-top:10px">투자 규칙: 트랙션×2 + 팀 + 인맥이 목표 점수에 닿으면 자동으로 다음 라운드 진입, 투자금 입금. 매 턴 돈이 타고, 라운드가 올라갈수록 더 빨리 탄다. 초기 자금은 몇 달 치뿐이고 창업은 건강도 갉아먹는다 — 투자 유치, 대박, 그리고 일상의 작은 위로가 체력을 조금씩 채워준다. 일단 시드까지 살아남고, 꿈은 그다음에.</p>
      </div>
    </div>
    <button class="btn btn-primary" id="go">창업 시작</button>
  `;
  window.scrollTo(0, 0);
  armUiGuard();
  document.getElementById("go").addEventListener("click", nextNode);
}

/* ---------- 节点 ---------- */
function nextNode() {
  state.node++;
  if (state.node > TOTAL_NODES) { showFinalEnding(); return; }
  // 结算本期现金流 + 体力消耗 + 角色节点被动
  const nodeApplied = nodeStartEffects();
  renderHUD(nodeApplied);
  const zero = checkZero();
  if (zero) { showZeroEnding(zero); return; }

  // 阶段转场：进入新阶段时全屏展示 1.5s
  const phase = phaseOfNode(state.node);
  const prevPhase = state.node === 1 ? null : phaseOfNode(state.node - 1);
  if (phase !== prevPhase && ASSETS["phase_" + phase]) showPhaseTransition(phase);

  const bannerUrl = ASSETS["phase_" + phase];
  const headerHtml = bannerUrl
    ? `<div class="phase-banner" style="background-image:url('${bannerUrl}')">
        <div class="pb-time">${esc(timeLabel(state.node))}</div>
        <div class="pb-sub">이번 분기, 당신의 선택은 —</div>
      </div>`
    : `<div class="card">
        <h2>${esc(timeLabel(state.node))}</h2>
        <p class="dim">이번 분기, 당신의 선택은 —</p>
      </div>`;

  const choices = drawChoices();
  // 第 7 年起（节点 24–27），若尚未启动上市筹备，每年多出一个特殊选项
  if (state.node >= 24 && !state.ipoPrepYear) choices.push(IPO_ACTION);
  $main.innerHTML = `
    ${headerHtml}
    <div class="choice-list">
    ${choices.map((a, i) => `
      <button class="btn ${a.id === "IPO_PREP" ? "btn-ipo" : ""}" data-i="${i}">
        <div class="btn-title"><span class="key-hint">[${i + 1}]</span><span class="tag-chip">${esc(a.tag)}</span>${esc(a.title)}</div>
        <div class="btn-sub">${esc(a.scene)}</div>
      </button>`).join("")}
    </div>
  `;
  window.scrollTo(0, 0);
  armUiGuard();
  $main.querySelectorAll("[data-i]").forEach(btn => {
    btn.addEventListener("click", () => onAction(choices[+btn.dataset.i]));
  });
}

// 结算印章：成 / 平 / 败（有素材用章图叠字，缺图降级彩色圆环）
function stampHtml(tier) {
  const kind = (tier === "crit_success" || tier === "success") ? "success"
    : tier === "mid" ? "mid" : "fail";
  const char = kind === "success" ? "성" : kind === "mid" ? "무" : "패";
  const url = ASSETS["stamp_" + kind];
  return `<div class="stamp ${kind}${url ? "" : " no-img"}">${url ? `<img src="${url}" alt="">` : ""}<span class="stamp-char">${char}</span></div>`;
}

// 阶段转场全屏层，1.5s 后淡出自毁
function showPhaseTransition(phase) {
  const el = document.createElement("div");
  el.id = "phase-transition";
  el.style.backgroundImage = `url('${ASSETS["phase_" + phase]}')`;
  el.innerHTML = `<div class="pt-name">${esc(PHASE_META[phase].name)}</div>
    <div class="pt-sub">${esc(PHASE_META[phase].sub)}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("fade-out"), 1500);
  setTimeout(() => el.remove(), 1800);
}

function onAction(action) {
  if (action.id === "IPO_PREP") state.ipoPrepYear = state.node - 17;
  const r = resolveAction(action);
  renderHUD(r.applied);
  const critClass = r.tier === "crit_success" ? "crit-success" : r.tier === "crit_fail" ? "crit-fail" : "";
  const critFxUrl = r.tier === "crit_success" ? ASSETS.fx_crit_success
    : r.tier === "crit_fail" ? ASSETS.fx_crit_fail : null;
  $main.innerHTML = `
    ${debugPanel({ ...r, S: action.S, F: action.F })}
    <div class="card result-card ${critClass}">
      ${critFxUrl ? `<img class="crit-fx" src="${critFxUrl}" alt="">` : ""}
      ${stampHtml(r.tier)}
      <h2>${esc(action.title)}</h2>
      ${r.prefix ? `<span class="crit-prefix">${esc(r.prefix)}</span>` : ""}
      <p class="scene">${esc(r.text)}</p>
      ${fxTags(r.applied)}
      ${(r.notes || []).map(n => `<div class="char-note">${esc(n)}</div>`).join("")}
    </div>
    <button class="btn btn-primary" id="next">계속</button>
  `;
  window.scrollTo(0, 0);
  armUiGuard();
  document.getElementById("next").addEventListener("click", afterAction);
}

function afterAction() {
  const zero = checkZero();
  if (zero) { showZeroEnding(zero); return; }
  const rounds = checkFunding();
  if (rounds.length) { showFundingEvent(rounds, afterFunding); return; }
  afterFunding();
}

function afterFunding() {
  maybeAcquisitionOffer(() => {
    const card = maybeDrawWildcard();
    if (card) { showWildcard(card); return; }
    nextNode();
  });
}

/* ---------- 收购要约（A 轮后偶发） ---------- */
function maybeAcquisitionOffer(cont) {
  if (state.stage < 2 || state.acqOffers >= 2 || state.node >= TOTAL_NODES || Math.random() >= 0.10) { cont(); return; }
  state.acqOffers++;
  const late = state.stage >= 4; // C 轮及以后
  const amount = late ? 600 + state.stats.traction * 12 : 100 + state.stats.traction * 3;
  const title = late ? "공룡 기업의 천문학적 제안" : "대기업이 손을 내밀었다";
  const scene = late
    ? `상대 M&A 팀이 미팅을 아예 로펌에서 잡았다. 인수가 ${amount}억, 현금+주식 교환, 조건 협상은 단 한 라운드 — 진심이라는 뜻이다.`
    : `전략투자팀이 세 번째 커피챗에서 드디어 패를 깠다: 100% 인수, 기업가치 ${amount}억, 팀 전원 흡수, 부사장 직속 보고 라인.`;
  const overlay = document.createElement("div");
  overlay.id = "overlay";
  overlay.innerHTML = `
    <div class="wildcard">
      <span class="wildcard-tag">🤝 인수 제안</span>
      <h2>${esc(title)}</h2>
      <p class="scene">${esc(scene)}</p>
      <div style="margin-top:14px">
        <button class="btn" data-i="0"><div class="btn-title"><span class="key-hint">[1]</span>제안 수락</div></button>
        <button class="btn" data-i="1"><div class="btn-title"><span class="key-hint">[2]</span>거절하고 독립 노선</div></button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  armUiGuard();
  overlay.querySelector('[data-i="0"]').addEventListener("click", () => {
    overlay.remove();
    const e = late ? ACQUIRE_ENDINGS.late : ACQUIRE_ENDINGS.early;
    showEndingPage(e.title, "인수 엔딩", e.text, e.lesson);
  });
  overlay.querySelector('[data-i="1"]').addEventListener("click", () => {
    const applied = applyFx({ network: 3, team: 3 });
    renderHUD(applied);
    overlay.querySelector(".wildcard").innerHTML = `
      <span class="wildcard-tag">🤝 인수 제안</span>
      <h2>${esc(title)}</h2>
      <p class="dim" style="margin-bottom:8px">선택: 거절</p>
      <p class="scene">소문은 하루 만에 퍼졌다. 「대기업 제안을 거절한 회사」는 최고의 채용 공고가 됐다. 아쉬워하는 팀원도 있었지만, 더 많은 눈이 반짝였다.</p>
      ${fxTags(applied)}
      <div style="margin-top:14px"><button class="btn btn-primary" id="acq-next">계속</button></div>
    `;
    armUiGuard();
    overlay.querySelector("#acq-next").addEventListener("click", () => { overlay.remove(); cont(); });
  });
}

/* ---------- 融资事件 ---------- */
function showFundingEvent(rounds, done) {
  renderHUD();
  const round = rounds[0];
  const rest = rounds.slice(1);
  const overlay = document.createElement("div");
  overlay.id = "overlay";
  const heroHtml = ASSETS.fx_funding
    ? `<img class="funding-hero" src="${ASSETS.fx_funding}" alt="">`
    : `<div class="funding-emoji">💸</div>`;
  overlay.innerHTML = `
    <div class="wildcard funding-card">
      <span class="wildcard-tag">💰 투자금 입금</span>
      <h2>${esc(round.name)} 라운드 클로징</h2>
      ${heroHtml}
      <div class="funding-amount" style="text-align:center">+${round.amount}억</div>
      <div class="fx-list" style="justify-content:center"><span class="fx-tag pos">❤️ 건강 +6</span><span class="fx-tag" style="color:var(--text-dim)">입금 문자를 본 밤, 오랜만에 푹 잤다</span></div>
      ${stageBadgeHtml("lg")}
      <p class="scene" style="margin-top:10px">${esc(round.text)}</p>
      <div style="margin-top:14px"><button class="btn btn-primary" id="fund-next">계속</button></div>
    </div>
  `;
  document.body.appendChild(overlay);
  armUiGuard();
  overlay.querySelector("#fund-next").addEventListener("click", () => {
    overlay.remove();
    if (rest.length) { showFundingEvent(rest, done); return; }
    done();
  });
}

/* ---------- 百搭卡 ---------- */
function showWildcard(card) {
  const overlay = document.createElement("div");
  overlay.id = "overlay";
  const frameAttr = ASSETS.card_frame ? ` style="background-image:url('${ASSETS.card_frame}')"` : "";
  const frameCls = ASSETS.card_frame ? " framed" : "";
  overlay.innerHTML = `
    <div class="wildcard${frameCls}"${frameAttr}>
      <span class="wildcard-tag">⚡ 돌발 이벤트</span>
      <h2>${esc(card.title)}</h2>
      <p class="scene">${esc(card.scene)}</p>
      <div style="margin-top:14px">
        ${card.options.map((o, i) => `
          <button class="btn" data-i="${i}"><div class="btn-title"><span class="key-hint">[${i + 1}]</span>${esc(o.label)}</div></button>`).join("")}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  armUiGuard();
  overlay.querySelectorAll("[data-i]").forEach(btn => {
    btn.addEventListener("click", () => {
      const opt = card.options[+btn.dataset.i];
      const applied = applyFx(charFx(opt.fx));
      renderHUD(applied);
      overlay.querySelector(".wildcard").innerHTML = `
        <span class="wildcard-tag">⚡ 돌발 이벤트</span>
        <h2>${esc(card.title)}</h2>
        <p class="dim" style="margin-bottom:8px">선택: ${esc(opt.label)}</p>
        <p class="scene">${esc(opt.text)}</p>
        ${fxTags(applied)}
        <div style="margin-top:14px"><button class="btn btn-primary" id="wc-next">계속</button></div>
      `;
      armUiGuard();
      overlay.querySelector("#wc-next").addEventListener("click", () => {
        overlay.remove();
        const zero = checkZero();
        if (zero) { showZeroEnding(zero); return; }
        const rounds = checkFunding();
        if (rounds.length) { showFundingEvent(rounds, nextNode); return; }
        nextNode();
      });
    });
  });
}

/* ---------- 结局 ---------- */
function endingReport() {
  const critSuccess = state.log.filter(l => l.tier === "crit_success").slice(0, 5);
  const critFail = state.log.filter(l => l.tier === "crit_fail").slice(0, 5);
  const logHtml = [...critSuccess, ...critFail]
    .sort((a, b) => a.node - b.node)
    .map(l => `<div class="log-item ${l.tier}">
      <span class="log-time">${esc(l.time)}</span>
      <span class="log-tier">${l.tier === "crit_success" ? "🎉 대성공" : "💀 대실패"}</span>
      · ${esc(l.title)}
    </div>`).join("");
  const fundingHtml = state.funding.map(f => `<div class="log-item fund">
    <span class="log-time">${esc(f.time)}</span>
    <span class="log-tier">💰 ${esc(f.name)}</span>
    · ${f.amount}억 입금
  </div>`).join("");
  return `
    <div class="card">
      <h2>📋 10년 창업 리포트</h2>
      <p class="dim" style="margin-bottom:10px">이번 판 캐릭터: ${state.char ? `${charHeadHtml(state.char, "sm")} ${esc(state.char.name)}「${esc(state.char.title)}」` : "없음"} ｜ 최종 라운드: ${esc(stageName())} ｜ 투자 점수 ${fundScore()}</p>
      ${ATTRS.map(a => `<div class="report-stat">${statBlock(a)}</div>`).join("")}
      <h2 style="margin-top:16px">💰 투자 히스토리</h2>
      ${fundingHtml || `<p class="dim">10년간 투자 한 푼 안 받았다 — 이것도 일종의 근성이다.</p>`}
      ${logHtml ? `<h2 style="margin-top:16px">🔑 결정적 순간들</h2>${logHtml}` : `<p class="dim" style="margin-top:12px">이 10년엔 천지가 흔들리는 대성공도 대실패도 없었다 — 평범함도 하나의 서사다.</p>`}
    </div>
    <button class="btn btn-primary" id="restart">한 판 더</button>
    <div class="footnote">이 게임은 픽션입니다. 어딘가 익숙하다면 — 당신, 진짜 창업해 봤군요.</div>
  `;
}

function showEndingPage(title, badge, text, lesson) {
  state.over = true;
  $main.innerHTML = `
    ${badge ? `<div class="ending-sub" style="margin-top:20px">${esc(badge)}</div>` : ""}
    <div class="ending-title">${esc(title)}</div>
    <div class="ending-sub">${esc(timeLabel(Math.min(Math.max(state.node, 1), TOTAL_NODES)))} · ${esc(state.idea.name)} · ${esc(stageName())}</div>
    <div class="card">
      <p class="ending-text scene">${esc(text)}</p>
      <div class="ending-lesson">${esc(lesson)}</div>
    </div>
    ${endingReport()}
  `;
  armUiGuard();
  document.getElementById("restart").addEventListener("click", showStart);
  window.scrollTo(0, 0);
}

function showZeroEnding(attr) {
  const e = ENDINGS.zero[attr];
  showEndingPage(`${ATTR_META[attr].icon} ${e.title}`, "강제 엔딩", e.text, e.lesson);
}

function showFinalEnding() {
  const e = judgeFinalEnding();
  showEndingPage(e.title, e.badge || "10년 엔딩", e.text, e.lesson);
}

/* ---------- 键盘操作（桌面端）：1/2/3 选选项，回车/空格 继续 ---------- */
document.addEventListener("keydown", e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= "1" && e.key <= "6") {
    const scope = document.getElementById("overlay") || $main;
    const btns = scope.querySelectorAll("[data-i], [data-idea], [data-char]");
    const b = btns[+e.key - 1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter" || e.key === " ") {
    const target = document.getElementById("fund-next") || document.getElementById("wc-next")
      || document.getElementById("next") || document.getElementById("go")
      || document.getElementById("intro-go") || document.getElementById("restart");
    if (target) { e.preventDefault(); target.click(); }
  }
});

/* ---------- 启动 ---------- */
loadAssets().then(showIntro);
</script>
</body>
</html>
